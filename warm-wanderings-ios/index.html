<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warm Wanderings</title>
  <meta name="description" content="Reveal the places you've been with a personal exploration map.">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #071310; color: #f5fff9; }
    body { margin: 0; background: radial-gradient(circle at top, #174438, #071310 55%); min-height: 100vh; }
    main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
    .mark { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; font-size: 40px; background: linear-gradient(135deg, #3de0b6, #146b64); box-shadow: 0 18px 50px #0008; }
    h1 { font-size: clamp(42px, 9vw, 72px); line-height: .95; margin: 28px 0 18px; letter-spacing: -.045em; }
    p { color: #c6d8d0; font-size: 19px; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { color: #eafff7; text-decoration: none; border: 1px solid #ffffff32; padding: 12px 16px; border-radius: 999px; }
    a:hover { background: #ffffff12; }
  </style>
</head>
<body><main>
  <div class="mark" aria-hidden="true">⌁</div>
  <h1>Warm<br>Wanderings</h1>
  <p>Turn everyday walks, drives, and travels into a personal map. Clear the fog, revisit meaningful places, and watch your travel heatmap grow.</p>
  <nav><a href="privacy/">Privacy Policy</a><a href="support/">Support</a></nav>
</main></body>
</html>
